async function syncNow(manual) {
  if (!Sync.token || Sync.busy || IN_CLAUDE) return;
  if (navigator.onLine === false) { Sync.status = 'offline'; Sync.msg = 'Hors ligne : la synchro reprendra au retour d\'internet.'; syncUI(); return; }
  Sync.busy = true; Sync.status = 'busy'; syncUI();
  try {
    let remote = null;
    if (Sync.gistId) { try { remote = await readRemote(); } catch (e) { if (e.status === 404) Sync.gistId = ''; else throw e; } }
    if (!Sync.gistId) { const r = await findOrCreateGist(); Sync.gistId = r.id; if (!r.created) remote = await readRemote(); }
    const m = mergeData(remote);
    const n = await applyMerged(m);
    if (!tmdbKey && remote && typeof remote.tmdb === 'string' && /^([0-9a-f]{32}|eyJ[\w.-]+)$/i.test(remote.tmdb)) { setTmdbKey(remote.tmdb); scheduleSync(true, 500); }
    const local = syncPayload(), key = payloadKey(local), remoteKey = remote ? payloadKey({ works: (remote.works || []).map(normalizeWork).filter(Boolean), history: remote.history || [], tombs: remote.tombs || {}, tierlists: (remote.tierlists || []).map(normTierList).filter(Boolean), tmdb: remote.tmdb || '' }) : '';
    if (key !== remoteKey) {
      await gh('/gists/' + Sync.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [SYNC_FILE]: { content: JSON.stringify({ ...local, syncedAt: new Date().toISOString() }) } } }) });
    }
    Sync.lastPushed = key; Sync.at = Date.now(); Sync.status = 'ok'; Sync.msg = '';
    saveSyncCfg();
    if (n) { refresh(); if (manual || n) toast(`Synchro : ${n} œuvre${n > 1 ? 's' : ''} mise${n > 1 ? 's' : ''} à jour depuis ton autre appareil.`, 'ok'); }
    else if (manual) toast('Tout est déjà synchronisé.', 'ok');
  } catch (e) {
    Sync.status = 'error'; Sync.msg = e.message || String(e);
    if (manual) toast('Synchro impossible : ' + Sync.msg, 'error');
  } finally { Sync.busy = false; syncUI(); }
}
function syncSoon(delay = 3000) {
  if (!Sync.token || Sync.applying || IN_CLAUDE) return;
  clearTimeout(Sync.timer); Sync.timer = setTimeout(() => syncNow(false), delay);
}
async function connectSync() {
  const inp = $('#sync-token'); const tok = (inp && inp.value || '').trim().replace(/\s+/g, '');
  if (!/^(ghp_|github_pat_|gho_)[A-Za-z0-9_]{20,}$/.test(tok)) { toast('Ce code ne ressemble pas à un code GitHub (il commence par « ghp_ »).', 'error'); return; }
  Sync.token = tok; Sync.gistId = ''; Sync.status = 'busy'; syncUI();
  try {
    const u = await gh('/user'); Sync.login = u.login || '';
    saveSyncCfg();
    await syncNow(false);
    if (Sync.status === 'ok') { toast(`Synchronisation activée sur ce compte GitHub (${Sync.login}).`, 'ok'); celebrate(); }
    else throw new Error(Sync.msg);
  } catch (e) {
    Sync.token = ''; Sync.status = 'error'; Sync.msg = e.message; saveSyncCfg(); toast('Connexion impossible : ' + e.message, 'error');
  }
  refresh();
}
function stopSync() { Object.assign(Sync, { token: '', gistId: '', login: '', status: 'off', msg: '', lastPushed: '' }); try { localStorage.removeItem('fl_sync'); } catch (e) { } refresh(); toast('Synchronisation désactivée sur cet appareil. Tes œuvres restent ici.', 'ok'); }
function syncStatusText() {
  if (Sync.status === 'busy') return '<span class="dot"></span>Synchronisation en cours…';
  if (Sync.status === 'error') return `<span class="dot warn"></span>${esc(Sync.msg)}`;
  if (Sync.status === 'offline') return `<span class="dot warn"></span>${esc(Sync.msg)}`;
  return `<span class="dot"></span>Active${Sync.login ? ` (compte ${esc(Sync.login)})` : ''}${Sync.at ? ` · dernière synchro ${relTime(Sync.at)}` : ''}.`;
}
function syncUI() {
  const el = $('#sync-status'); if (el) el.innerHTML = syncStatusText();
  const chip = $('#save-state'); if (chip && Sync.token && Sync.status === 'busy') chip.innerHTML = '<span class="dot"></span>Synchro…';
}
function syncPanelHTML() {
  if (IN_CLAUDE) return `<section class="panel"><h3>Synchronisation PC ↔ téléphone</h3><p style="margin:0;color:var(--muted)">Indisponible dans la version ouverte sur claude.ai. Utilise l'appli installée ou le site en ligne.</p></section>`;
  if (Sync.token) return `<section class="panel sync-panel"><h3>Synchronisation PC ↔ téléphone</h3>
    <p style="margin:0" id="sync-status">${syncStatusText()}</p>
    <p style="margin:0;color:var(--muted);font-size:13px">Tes films et séries se synchronisent tous seuls à l'ouverture de l'appli et après chaque modification. Sur ton autre appareil, colle le même code (ou un autre code du même compte GitHub).</p>
    <div class="d-actions"><button class="btn primary" type="button" data-action="sync-now">⟳ Synchroniser maintenant</button><button class="btn ghost" type="button" data-action="sync-stop">Désactiver sur cet appareil</button></div></section>`;
  return `<section class="panel sync-panel"><h3>Synchronisation PC ↔ téléphone</h3>
    <p style="margin:0;color:var(--muted)">Plus besoin d'exporter : ta liste reste la même sur ton PC et ton téléphone. Tu peux réutiliser le code GitHub de ton appli animés. Elle est rangée dans un espace secret de ton compte GitHub (gratuit).</p>
    <ol class="sync-steps">
      <li>Ouvre <a href="https://github.com/settings/tokens/new?scopes=gist&description=Film%20Liste%20synchro" target="_blank" rel="noopener">cette page GitHub ↗</a> (connecte-toi si besoin). La case <b>gist</b> est déjà cochée.</li>
      <li>Dans « Expiration », choisis <b>No expiration</b>, puis clique en bas sur <b>Generate token</b>.</li>
      <li>Copie le code qui commence par <b>ghp_</b> et colle-le ici :</li>
    </ol>
    <div class="d-actions" style="align-items:center"><input class="input" id="sync-token" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_…" style="flex:1;min-width:220px"><button class="btn primary" type="button" data-action="sync-connect">Connecter</button></div>
    ${Sync.status === 'error' && Sync.msg ? `<div class="notice err">${esc(Sync.msg)}</div>` : ''}
    <p style="margin:0;color:var(--faint);font-size:12.5px">Fais pareil sur ton autre appareil, avec le même code ou un nouveau code créé de la même façon. Ce code donne seulement accès à tes « gists » (de petits fichiers GitHub), pas à tes projets ni à ton mot de passe. Il reste enregistré sur l'appareil.</p></section>`;
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action^="sync-"]'); if (!a) return;
  if (a.dataset.action === 'sync-connect') connectSync();
  else if (a.dataset.action === 'sync-now') syncNow(true);
  else if (a.dataset.action === 'sync-stop') stopSync();
});
document.addEventListener('keydown', e => { if (e.target.id === 'sync-token' && e.key === 'Enter') { e.preventDefault(); connectSync(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && Sync.token && Date.now() - Sync.at > 20000) syncSoon(300); });
window.addEventListener('online', () => syncSoon(500));
setInterval(() => { if (!document.hidden && Sync.token && Date.now() - Sync.at > 120000) syncNow(false); }, 60000);

/* ---------- Démarrage ---------- */
(async function boot() {
  loadPrefs();
  $('#main').innerHTML = '<div class="view"><div class="notice">Chargement de ta bibliothèque…</div></div>';
  await Storage.init();
  try {
    state.works = (await Storage.getAll('works')).map(normalizeWork).filter(Boolean);
    state.history = (await Storage.getAll('history')).map(normalizeHistory).filter(Boolean).sort((a, b) => b.at - a.at);
  } catch (e) { console.error(e); toast('Lecture des données impossible : ' + e.message, 'error'); }
  render(); markSaved();
  initFileBackup();
  scheduleSync(false, 1200);
  syncSoon(1500);
  if (Storage.mode === 'memory') toast('Ce navigateur bloque le stockage : tes données ne seront pas conservées. Exporte-les avant de fermer.', 'error');
})();
</script>
